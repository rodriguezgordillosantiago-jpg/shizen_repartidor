<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>Shizen — Pedidos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/repartidor.css" />
    <link rel="stylesheet" href="styles/navigation.css" />
  </head>
  <body>
    <main class="scroll">
      <h1 style="margin: 0 0 4px; font-size: 20px">
        Pedidos disponibles
      </h1>
      <p
        style="
          margin: 0 0 18px;
          color: #9ca3af;
          font-size: 12px;
        "
      >
        Acepta los pedidos que quieras entregar
      </p>
      <div id="orders"></div>
    </main>
    <nav
      class="bottom-nav"
      aria-label="Navegaci?n principal"
    >
      <a
        href="inicio.html"
        class="nav-item"
        aria-label="Inicio"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10.5 12 3l9 7.5v8.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V10.5Z"
          /></svg
          <path d="M9 21v-5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V21" /></svg
        ><span>Inicio</span></a
      >
      <a
        href="activos.html"
        class="nav-item"
        aria-label="Activos"
      >
        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4 8-4V7M12 11v10"
          /></svg
        ><span>Activos</span
        ><b class="badge" id="badge-activos"></b
      ></a>
      <button
        id="delivery-status-toggle"
        class="nav-status-toggle"
        type="button"
        aria-pressed="false"
      >
        <span class="nav-status-icon"
          ><svg
            width="18"
            height="18"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              d="M12 2v10m0 0 4-4m-4 4-4-4M5 13v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"
            /></svg
        ></span>
        <span class="nav-status-label">Activo</span>
      </button>
      <a
        href="pedidos.html"
        class="nav-item is-active"
        aria-current="page"
        aria-label="Pedidos"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 7h12l-1 13H7L6 7Zm3 0a3 3 0 0 1 6 0M9 12v4m6-4v4"
          /></svg
        ><span>Pedidos</span
        ><b class="badge" id="badge-pedidos"></b
      ></a>
      <a
        href="../php/perfil.php"
        class="nav-item"
        aria-label="Perfil"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Zm-12 14a8 8 0 0 1 16 0"
          /></svg
        ><span>Perfil</span></a
      >
    </nav>
    <div id="chat-root"></div>
    <script src="../js/data.js"></script>
    <script src="../js/chat.js"></script>
    <script>
      async function render() {
        const result = await cargarEntregas("available");
        const list = result.items;
        const full = false;
        document.querySelector("#orders").innerHTML =
          list.length
            ? list
                .map(
                  (p) =>
                    `<article class="card order"><div class="order-head"><div class="order-main"><p class="name">${p.cliente_nombre} ${p.cliente_apellido}</p><p class="muted">Pedido #${p.id_pedido}</p></div><div class="earn"><strong>${fmt(p.total)}</strong></div></div><div class="route">📍 Recoger: ${p.negocio_nombre}<br>🏁 Entregar: ${p.direccion_entrega}</div><div class="actions"><button class="btn-green" ${full ? 'disabled style="opacity:.55"' : ""} onclick="accept('${p.id_entrega}')">Aceptar</button></div></article>`,
                )
                .join("")
            : `<div class="card" style="padding:32px;text-align:center;color:#9ca3af;font-size:13px">No hay pedidos disponibles ahora</div>`;
      }
      async function accept(id) {
        try { await actualizarEntrega("accept", id); await render(); } catch (error) { alert(error.message); }
      }
      render();
      iniciarBotonEstadoRepartidor();
      initChat();
    </script>
  </body>
</html>
