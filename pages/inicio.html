<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Shizen — Inicio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/inicio.css" />
    <link rel="stylesheet" href="styles/navigation.css" />
  </head>
  <body>
    <div class="scroll" id="content">
      <!-- Header filled by JS -->
    </div>

    <!-- Bottom Nav -->
    <nav
      class="bottom-nav"
      aria-label="Navegaci?n principal"
    >
      <a
        href="inicio.html"
        class="nav-item is-active"
        aria-current="page"
        aria-label="Inicio"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10.5 12 3l9 7.5v8.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V10.5Z"
          /></svg
          <path d="M9 21v-5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V21" /></svg
        ><span>Inicio</span></a
      >
      <a
        href="activos.html"
        class="nav-item"
        aria-label="Activos"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4 8-4V7M12 11v10"
          /></svg
        ><span>Activos</span
        ><b class="badge" id="badge-activos"></b
      ></a>
      <button
        id="delivery-status-toggle"
        class="nav-status-toggle"
        type="button"
        aria-pressed="false"
      >
        <span class="nav-status-icon"
          ><svg
            width="18"
            height="18"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              d="M12 2v10m0 0 4-4m-4 4-4-4M5 13v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"
            /></svg
        ></span>
        <span class="nav-status-label">Activo</span>
      </button>
      <a
        href="pedidos.html"
        class="nav-item"
        aria-label="Pedidos"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 7h12l-1 13H7L6 7Zm3 0a3 3 0 0 1 6 0M9 12v4m6-4v4"
          /></svg
        ><span>Pedidos</span
        ><b class="badge" id="badge-pedidos"></b
      ></a>
      <a
        href="../php/perfil.php"
        class="nav-item"
        aria-label="Perfil"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Zm-12 14a8 8 0 0 1 16 0"
          /></svg
        ><span>Perfil</span></a
      >
    </nav>

    <!-- Chat root -->
    <div id="chat-root"></div>

    <script src="../js/data.js"></script>
    <script src="../js/chat.js"></script>
    <script>
      async function render() {
        const perfil = getPerfil();
        const [activeResult, availableResult] = await Promise.all([cargarEntregas("active"), cargarEntregas("available")]);
        const activos = activeResult.items;
        const disponibles = availableResult.items;
        const ca = activos.length;
        const lleno = ca >= 4;

        document.getElementById("content").innerHTML = `
      <!-- Green header -->
      <div style="background:linear-gradient(135deg,#4c9540,#2d6b22);padding:40px 20px 24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div>
            <p style="margin:0 0 2px;font-size:13px;color:rgba(255,255,255,.75);font-weight:600">Bienvenido de vuelta</p>
            <h1 style="margin:0;font-size:22px;font-weight:800;color:white">${perfil.nombre} ${perfil.apellido}</h1>
          </div>
          <img src="../assets/logo_blanco.png" alt="Shizen"
            style="height:64px;width:128px;object-fit:contain;filter:brightness(0) invert(1)">
        </div>
        <!-- Stats row -->
        <div style="display:flex;gap:10px">
          <div style="flex:1;background:white;border-radius:14px;padding:10px;text-align:center">
            <p style="margin:0 0 2px;font-size:10px;color:#9ca3af;font-weight:600">Entregas hoy</p>
            <p style="margin:0;font-size:14px;font-weight:800;color:#4c9540">${perfil.entregasHoy}</p>
          </div>
          <div style="flex:1;background:white;border-radius:14px;padding:10px;text-align:center">
            <p style="margin:0 0 2px;font-size:10px;color:#9ca3af;font-weight:600">Ganancias</p>
            <p style="margin:0;font-size:14px;font-weight:800;color:#f97316">${fmt(perfil.gananciasHoy)}</p>
          </div>
          <div style="flex:1;background:white;border-radius:14px;padding:10px;text-align:center">
            <p style="margin:0 0 2px;font-size:10px;color:#9ca3af;font-weight:600">Calificación</p>
            <p style="margin:0;font-size:14px;font-weight:800;color:#4c9540">⭐ ${perfil.calificacion}</p>
          </div>
        </div>
      </div>

      <!-- Cupo banner -->
      <div style="margin:16px 16px 0">
        <div style="border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;
          background:${lleno ? "#fef2f2" : "#f0fdf4"};border:1px solid ${lleno ? "#fecaca" : "#bbf7d0"}">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="${lleno ? "#ef4444" : "#4c9540"}" stroke-width="2" style="flex-shrink:0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <div>
            <p style="margin:0 0 2px;font-size:13px;font-weight:700;color:${lleno ? "#dc2626" : "#166534"}">
              ${lleno ? "Cupo lleno — máx. 4 pedidos" : `Pedidos activos: ${ca} / 4`}
            </p>
            <p style="margin:0;font-size:11px;color:#6b7280">
              ${lleno ? "Entrega los actuales para aceptar más" : `Puedes aceptar ${4 - ca} más`}
            </p>
          </div>
        </div>
      </div>


      <!-- Available orders preview -->
      <div style="padding:20px 16px 0">
        <h2 style="margin:0 0 12px;font-size:15px;font-weight:800;color:#1a1a1a">Nuevos pedidos</h2>
        ${
          disponibles.length === 0
            ? `
          <div style="background:white;border-radius:16px;border:1px solid rgba(0,0,0,.07);padding:24px;text-align:center">
            <p style="margin:0;color:#9ca3af;font-size:13px">No hay pedidos disponibles ahora</p>
          </div>`
            : disponibles
                .slice(0, 2)
                .map(
                  (p) => `
          <div class="card" style="padding:14px;margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
              <img src="${p.avatar}" alt="${p.cliente}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0">
              <div style="flex:1;min-width:0">
                <p style="margin:0 0 2px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.cliente_nombre} ${p.cliente_apellido}</p>
                <p style="margin:0;font-size:11px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.negocio_nombre}</p>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <p style="margin:0 0 2px;font-size:13px;font-weight:800;color:#4c9540">${fmt(p.total)}</p>
                <p style="margin:0;font-size:10px;color:#9ca3af">Pedido #${p.id_pedido}</p>
              </div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn-green" style="flex:1;height:36px;font-size:12px" ${lleno ? 'disabled style="flex:1;height:36px;font-size:12px;background:#a0c99b;cursor:not-allowed"' : ""} onclick="aceptar('${p.id_entrega}')">
                ${lleno ? "Cupo lleno" : "Aceptar"}
              </button>
            </div>
          </div>`,
                )
                .join("")
        }
      </div>
    `;
      }

      async function aceptar(id) {
        try { await actualizarEntrega("accept", id); await render(); } catch (error) { alert(error.message); }
      }

      render();
      iniciarBotonEstadoRepartidor();
      initChat();
    </script>
  </body>
</html>
