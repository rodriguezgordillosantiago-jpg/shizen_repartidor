<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Shizen — Perfil</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../pages/styles/perfil.css" />
    <link rel="stylesheet" href="../pages/styles/navigation.css" />

    <style>
      /* Estilos traídos de Shizen Movil (Usuario Común) */
      .scroll {
        padding-bottom: 80px; /* espacio para bottom-nav */
        overflow-y: auto;
        height: 100vh;
        box-sizing: border-box;
      }
      .green-header {
        background: linear-gradient(135deg, #f0faf0, #ffffff);
        border-bottom: 1px solid #c8e6c9;
        padding: 38px 24px 28px;
        position: relative;
        text-align: center;
      }
      .profile-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border: none;
        background: none;
        border-bottom: 1px solid #f3f4f6;
        font-family: "Inter", sans-serif;
        transition: background 0.15s;
        text-decoration: none;
        color: inherit;
        box-sizing: border-box;
      }
      a.profile-row:hover,
      button.profile-row:hover {
        background: #f9fafb;
      }
      .card-container {
        background: white;
        border-radius: 12px;
        border: 1px solid #e8f5e9;
        overflow: hidden;
        position: relative;
      }
      h2.section-title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        margin: 0;
      }

      /* Estilos para el modo edicion de la tarjeta de repartidor */
      .card__title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
      }
      .card__edit-btn {
        font-size: 14px;
        font-weight: 600;
        color: #3a8c3f;
        cursor: pointer;
      }
      .card__edit-btn--cancel {
        display: none;
        color: #6b7280;
      }
      .edit-toggle-checkbox:checked
        ~ .card__title-row
        .card__edit-btn--edit {
        display: none;
      }
      .edit-toggle-checkbox:checked
        ~ .card__title-row
        .card__edit-btn--cancel {
        display: inline-block;
      }

      .card__details--edit {
        display: none;
        padding: 0 16px 16px;
        flex-direction: column;
        gap: 12px;
      }
      .edit-toggle-checkbox:checked ~ .card__details--view {
        display: none;
      }
      .edit-toggle-checkbox:checked ~ .card__details--edit {
        display: flex;
      }

      .field-group small {
        display: block;
        margin-bottom: 4px;
        color: #6b7280;
        font-size: 13px;
      }
      .field-group .field {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-family: "Inter", sans-serif;
        font-size: 15px;
      }
      .btn-green {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #4c9540;
        color: #1b3a1d;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 8px;
      }
    </style>
  </head>

  <body>
    <main class="scroll">
      {{ALERTAS}}
      <!-- Encabezado verde -->
      <div class="green-header">
        <img
          src="../assets/logo_color.png"
          alt="Shizen"
          style="
            position: absolute;
            top: 30px;
            right: 24px;
            height: 32px;
            object-fit: contain;
            opacity: 0.9;
          "
        />
        <div
          class="profile-avatar"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
          "
        >
          <div
            style="
              width: 88px;
              height: 88px;
              background: white;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              margin-bottom: 12px;
              box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
              font-size: 32px;
              font-weight: bold;
              color: #4c9540;
            "
          >
            <img
              src="{{FOTO_URL}}"
              alt="Foto de perfil de {{NOMBRE_COMPLETO}}"
              onerror="this.hidden = true; this.nextElementSibling.hidden = false"
              style="
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
              "
            />
            <span hidden>{{INICIALES}}</span>
          </div>
          <h1
            style="
              color: #1b3a1d;
              font-size: 22px;
              font-weight: 700;
              margin: 0 0 2px 0;
            "
          >
            {{NOMBRE_COMPLETO}}
          </h1>
          <p
            style="
              color: #555;
              font-size: 13px;
            "
          >
            {{EMAIL}} · {{VEHICULO}}
          </p>
          <div
            style="
              margin-top: 12px;
              display: inline-flex;
              align-items: center;
              background: #e8f5e9;
              padding: 4px 12px;
              border-radius: 16px;
            "
          >
            <span
              style="
                width: 8px;
                height: 8px;
                background: #5cb85c;
                border-radius: 50%;
                margin-right: 6px;
              "
            ></span>
            <span
              style="
                color: #2d6a31;
                font-size: 12px;
                font-weight: 500;
              "
              >En línea</span
            >
          </div>
        </div>
      </div>

      <!-- Información personal (Editable) -->
      <div style="padding: 20px 16px 0">
        <div class="card-container">
          <!-- El checkbox oculto nativo que ya estaba en el proyecto -->
          <div class="card__title-row">
            <h2 class="section-title" style="margin: 0">
              Datos del Repartidor
            </h2>
          </div>

          <!-- Vista Solo Lectura -->
          <div class="card__details card__details--view">
            <button type="button" class="profile-row profile-row--editable" id="open-profile-modal-name">
              <span class="profile-row__content">
                <span class="profile-row__icon">👤</span>
                <span>
                  <small>Nombre</small>
                  <strong>{{NOMBRE_COMPLETO}}</strong>
                </span>
              </span>
              <span class="profile-row__edit">Editar</span>
            </button>
            <div
              class="profile-row"
              style="
                cursor: default;
                border-top: 1px solid #e5e7eb;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                "
              >
                <svg
                  width="18"
                  height="18"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="#6b7280"
                  stroke-width="2"
                >
                  <path
                    d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                  />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <div style="text-align: left">
                  <p
                    style="font-size: 12px; color: #9ca3af"
                  >
                    Correo electrónico
                  </p>
                  <p
                    style="
                      font-size: 15px;
                      font-weight: 600;
                      color: #111827;
                    "
                  >
                    {{EMAIL}}
                  </p>
                </div>
              </div>
            </div>
            <button type="button" class="profile-row profile-row--editable" id="open-profile-modal-vehicle">
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                "
              >
                <svg
                  width="18"
                  height="18"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="#6b7280"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 2C7 2 3 6 3 11V22H21V11C21 6 17 2 12 2Z"
                  />
                </svg>
                <div style="text-align: left">
                  <p
                    style="font-size: 12px; color: #9ca3af"
                  >
                    Vehículo
                  </p>
                  <p
                    style="
                      font-size: 15px;
                      font-weight: 600;
                      color: #111827;
                    "
                  >
                    {{VEHICULO}}
                  </p>
                </div>
              </div>
              <span class="profile-row__edit">Editar</span>
            </button>
          </div>

        </div>
        <section class="documents-card">
          <h2 class="section-title">Documentos del vehículo</h2>
          <div class="vehicle-documents">{{DOCUMENTOS_VEHICULO}}</div>
        </section>
      </div>

      <div class="profile-modal" id="profile-modal" hidden>
        <div class="profile-modal__backdrop" data-close-profile-modal></div>
        <section class="profile-modal__content" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
          <div class="profile-modal__header">
            <h2 id="profile-modal-title">Editar perfil</h2>
            <button type="button" class="profile-modal__close" data-close-profile-modal aria-label="Cerrar">×</button>
          </div>
          <form action="perfil.php" method="POST" class="profile-form">
            <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}" />
            <label class="field-group">
              <small>Nombre</small>
              <input class="field" type="text" name="nombre" value="{{NOMBRE}}" maxlength="100" required />
            </label>
            <label class="field-group">
              <small>Apellido</small>
              <input class="field" type="text" name="apellido" value="{{APELLIDO}}" maxlength="100" required />
            </label>
            <label class="field-group">
              <small>Correo electrónico (no editable)</small>
              <input class="field" type="email" value="{{EMAIL}}" readonly aria-readonly="true" />
            </label>
            <label class="field-group">
              <small>Vehículo</small>
              <select class="field" name="vehiculo" required>
                <option value="{{VEHICULO}}" selected>{{VEHICULO}}</option>
                <option value="Moto">Moto</option>
                <option value="Bicicleta">Bicicleta</option>
                <option value="Carro">Carro</option>
                <option value="Monopatín">Monopatín</option>
              </select>
            </label>
            <button type="submit" class="btn-green field-save">Guardar cambios</button>
          </form>
        </section>
      </div>

      <!-- Estadísticas y Opciones -->
      <div style="padding: 20px 16px 0">
        <h2 class="section-title">Actividad</h2>
        <div class="card-container">
          <!-- Estadistica: Entregas (Solo display, sin flecha ni link) -->

            <div

                Entregas hoy

            </div>
            <div style="display: flex; align-items: center">
              <span
                style="
                  font-size: 16px;
                  font-weight: 700;
                  color: #4c9540;
                "
                >—</span
              >
            </div>
          </div>

          <!-- Estadistica: Ganancias (Solo display, sin flecha ni link) -->

            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
              "
            >
              <svg
                width="18"
                height="18"
                fill="none"
                viewBox="0 0 24 24"
                stroke="#6b7280"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10" />

              <p style="font-size: 15px; font-weight: 600">
                Ganancias
              </p>
            </div>
            <div style="display: flex; align-items: center">
              <span

                  font-size: 16px;

                  color: #4c9540;
                "

              >
            </div>
          </div>

          <!-- Opcion: Configuración (Este si es un link con flecha) -->

            href="../pages/configuracion.html"
            class="profile-row"
            style="border-bottom: none"

            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
              "
            >
              <svg
                width="18"
                height="18"
                fill="none"
                viewBox="0 0 24 24"
                stroke="#6b7280"

                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              <p style="font-size: 15px; font-weight: 600">
                Configuración
              </p>
            </div>
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="#9ca3af"
              stroke-width="2"
            >
              <polyline points="9,18 15,12 9,6" />
            </svg>
          </a>
        </div>
      </div>

      <!-- Cerrar sesión -->
      <div style="padding: 20px 16px 32px">
        <button
          type="button"
          id="logout-button"
          style="

            background: #fef2f2;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: &quot;Inter&quot;, sans-serif;
            transition: background 0.2s;

              font-size: 15px;
              font-weight: 700;

    <div id="chat-root"></div>
    <script>
      document.getElementById("logout-button").addEventListener("click", () => {
        window.location.href = "../php/logout.php";
      });
    </script>
    <script>
      const profileModal = document.getElementById("profile-modal");
      document.querySelectorAll("#open-profile-modal-name, #open-profile-modal-vehicle").forEach((button) => {
        button.addEventListener("click", () => {
          profileModal.hidden = false;
        });
      });
      document.querySelectorAll("[data-close-profile-modal]").forEach((element) => {
        element.addEventListener("click", () => {
          profileModal.hidden = true;
        });
      });
    </script>
